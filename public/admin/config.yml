backend:
  name: git-gateway
  branch: main

# Настройки медиа файлов
media_folder: "public/img"
public_folder: "/img"

# Коллекции данных
collections:
  - name: "prices"
    label: "💰 Price Management"
    files:
      - label: "🛒 Products & Prices"
        name: "products"
        file: "public/data/products.json"
        fields:
          - { label: "📅 Last Updated", name: "lastUpdated", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD" }
          - label: "📦 Products List"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - {{fields.price}}"
            fields:
              - { label: "🆔 Product ID", name: "id", widget: "string" }
              - { label: "📛 Product Name", name: "name", widget: "string" }
              - { label: "📝 Description", name: "description", widget: "string" }
              - { label: "🌍 Origin", name: "origin", widget: "string" }
              - { label: "💰 Price", name: "price", widget: "string", hint: "Format: 7,30 USD/kg" }
              - { label: "🖼️ Image Path", name: "image", widget: "string", hint: "e.g., /goods/cashew.webp" }
              - { label: "🔍 Modal ID", name: "modalId", widget: "string", hint: "e.g., modal-cashew" }
              - label: "📋 Product Varieties"
                name: "varieties"
                widget: "list"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "🏷️ Variety Name", name: "name", widget: "string" }
                  - { label: "💰 Price", name: "price", widget: "string", hint: "Format: 7,30 USD/kg or 'Price on request'" }
                  - { label: "📝 Description", name: "description", widget: "text" }